<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: transparent; overflow: hidden; }
    canvas { display: block; width: 512px; height: 512px; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script src="./three.min.js"></script>
  <script>
    const width = 512, height = 512;
    const scene = new THREE.Scene();
    
    // Orthographic camera for clean isometric/3D view
    const frustum = 3.2;
    const aspect = width / height;
    const camera = new THREE.OrthographicCamera(
      -frustum * aspect / 2, frustum * aspect / 2,
      frustum / 2, -frustum / 2,
      0.1, 100
    );
    camera.position.set(2, 4, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(2);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.getElementById('container').appendChild(renderer.domElement);

    // Studio Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
    keyLight.position.set(4, 8, 5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xd4ff00, 0.4);
    fillLight.position.set(-4, 2, -3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
    rimLight.position.set(0, -5, 3);
    scene.add(rimLight);

    // Cylinder with rounded edges or subtle bevel
    // In Figma, the top is slightly wider or cylindrical: radius ~0.75, height ~1.8
    const geom = new THREE.CylinderGeometry(0.72, 0.62, 1.85, 64);
    
    // Vibrant lime material: #C7FF00 / #D4FF00
    const mat = new THREE.MeshStandardMaterial({
      color: 0xC7FF00,
      roughness: 0.28,
      metalness: 0.04,
    });

    const mesh = new THREE.Mesh(geom, mat);
    // Tilt to match the reference: tilted forward and to the side
    mesh.rotation.x = 0.35;
    mesh.rotation.z = -0.32;
    mesh.rotation.y = 0.15;
    scene.add(mesh);

    renderer.render(scene, camera);
    window.renderComplete = true;
  </script>
</body>
</html>
